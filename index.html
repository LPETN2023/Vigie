<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111317" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Le Journal</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  :root {
    --fond: #f5f6f8; --surface: #ffffff; --surface-2: #eef0f4; --texte: #16181d; --doux: #626a78;
    --filet: #e3e6ec; --accent: #2f5bd3; --accent-doux: #e6ecfb; --une: #c2410c; --une-doux: #fdeee6;
    --ok: #15803d; --ok-doux: #e3f4e8; --non: #b42318; --non-doux: #fbe9e7;
    --ombre: 0 1px 2px rgba(16,24,40,.05), 0 4px 16px rgba(16,24,40,.06);
    --rayon: 14px; --entete: 56px;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fond: #111317; --surface: #1a1d23; --surface-2: #242830; --texte: #eceef2; --doux: #9aa3b2;
      --filet: #2c313a; --accent: #7aa2ff; --accent-doux: #1f2a44; --une: #fb923c; --une-doux: #3a2417;
      --ok: #4ade80; --ok-doux: #16301f; --non: #f87171; --non-doux: #3a1d1d;
      --ombre: 0 1px 2px rgba(0,0,0,.4);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--fond); color: var(--texte); font-family: var(--sans); font-size: 16px;
    -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; }
  a { color: inherit; }
  .cache { display: none !important; }
  .chargement { display: grid; place-items: center; min-height: 50vh; color: var(--doux); }

  /* ---------- Boutons ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px;
    padding: 0 16px; border-radius: 12px; font-weight: 600; font-size: .95rem; text-decoration: none;
    background: var(--surface-2); color: var(--texte);
  }
  .btn.principal { background: var(--accent); color: #fff; }
  @media (prefers-color-scheme: dark) { .btn.principal { color: #0b1020; } }
  .icone {
    width: 40px; height: 40px; border-radius: 10px; display: inline-grid; place-items: center; color: var(--doux);
  }
  .icone:hover, .icone[aria-pressed="true"] { background: var(--surface-2); color: var(--texte); }
  .icone svg { width: 22px; height: 22px; }
  .vote {
    width: 48px; height: 44px; border-radius: 12px; background: var(--surface-2); display: inline-grid; place-items: center;
  }
  .vote svg { width: 22px; height: 22px; }
  .vote.plus[data-actif="1"] { background: var(--ok-doux); color: var(--ok); }
  .vote.moins[data-actif="1"] { background: var(--non-doux); color: var(--non); }

  /* ---------- Connexion ---------- */
  #connexion { min-height: 100%; display: grid; place-items: center; padding: 16px; }
  #connexion form {
    width: 100%; max-width: 380px; background: var(--surface); padding: 32px 24px; border-radius: 20px; box-shadow: var(--ombre);
  }
  .logo { display: flex; align-items: center; gap: 10px; justify-content: center; margin-bottom: 6px; }
  .logo img { width: 36px; height: 36px; border-radius: 9px; }
  .logo span { font-size: 1.5rem; font-weight: 700; letter-spacing: -.01em; }
  #connexion p.sous { margin: 0 0 24px; text-align: center; color: var(--doux); font-size: .9rem; }
  label { display: block; font-size: .85rem; color: var(--doux); margin: 14px 0 6px; font-weight: 500; }
  input, textarea {
    width: 100%; padding: 12px 14px; font: inherit; font-size: 16px; color: var(--texte);
    background: var(--surface-2); border: 1px solid transparent; border-radius: 12px; outline: none;
  }
  input:focus, textarea:focus { border-color: var(--accent); background: var(--surface); }
  #connexion .btn.principal { width: 100%; margin-top: 22px; }
  .lien { color: var(--doux); text-decoration: underline; font-size: .85rem; padding: 10px 0; }
  .msg { min-height: 1.2em; font-size: .85rem; color: var(--non); margin-top: 8px; text-align: center; }

  /* ---------- En-tête ---------- */
  #app { min-height: 100%; }
  header.barre {
    position: sticky; top: 0; z-index: 20; height: calc(var(--entete) + env(safe-area-inset-top));
    padding: env(safe-area-inset-top) 8px 0 16px; display: flex; align-items: center; gap: 4px;
    background: color-mix(in srgb, var(--fond) 88%, transparent); backdrop-filter: saturate(180%) blur(14px);
    -webkit-backdrop-filter: saturate(180%) blur(14px); border-bottom: 1px solid var(--filet);
  }
  .marque { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
  .marque img { width: 28px; height: 28px; border-radius: 7px; }
  .marque b { font-size: 1.1rem; letter-spacing: -.01em; white-space: nowrap; }
  .compteur { font-variant-numeric: tabular-nums; color: var(--doux); font-size: .85rem; margin-right: 6px; }
  .segment { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 3px; margin-right: 4px; }
  .segment button { padding: 6px 10px; border-radius: 8px; font-size: .8rem; font-weight: 600; color: var(--doux); }
  .segment button[aria-pressed="true"] { background: var(--surface); color: var(--texte); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .alerte {
    margin: 12px 16px 0; padding: 10px 14px; border-radius: 12px; font-size: .85rem;
    background: var(--une-doux); color: var(--une);
  }

  /* ---------- Accueil ---------- */
  #accueil { max-width: 1200px; margin: 0 auto; padding: 16px 16px calc(env(safe-area-inset-bottom) + 32px); }
  .titre-section { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 8px 2px 12px; }
  .titre-section h2 { font-size: 1.35rem; margin: 0; letter-spacing: -.01em; }
  .titre-section span { color: var(--doux); font-size: .82rem; }

  .essentiel { background: var(--surface); border-radius: 18px; box-shadow: var(--ombre); padding: 18px 18px 8px; margin-bottom: 22px; }
  .essentiel h2 { margin: 0 0 2px; font-size: 1.2rem; display: flex; align-items: center; gap: 8px; }
  .essentiel .date { color: var(--doux); font-size: .82rem; margin-bottom: 8px; }
  .point { display: flex; gap: 12px; padding: 12px 0; border-top: 1px solid var(--filet); }
  .point:first-of-type { border-top: 0; }
  .point .puce { flex: 0 0 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-top: 8px; }
  .point .rub { font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); }
  .point p { margin: 3px 0 6px; line-height: 1.5; }
  .point .refs { display: flex; flex-wrap: wrap; gap: 6px; }
  .point .refs button {
    font-size: .78rem; color: var(--doux); background: var(--surface-2); padding: 4px 10px; border-radius: 999px;
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  .filtres { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 14px; scrollbar-width: none; }
  .filtres::-webkit-scrollbar { display: none; }
  .filtres button {
    flex: 0 0 auto; padding: 7px 12px; border-radius: 999px; font-size: .85rem; font-weight: 500;
    background: var(--surface); border: 1px solid var(--filet); color: var(--doux);
  }
  .filtres button[aria-pressed="true"] { background: var(--texte); color: var(--fond); border-color: var(--texte); }

  .grille { display: grid; gap: 10px; grid-template-columns: 1fr; }
  .vignette {
    display: flex; gap: 12px; text-align: left; width: 100%; background: var(--surface); border-radius: var(--rayon);
    padding: 10px; box-shadow: var(--ombre); align-items: flex-start; transition: transform .12s;
  }
  .vignette:active { transform: scale(.985); }
  .vignette .media { flex: 0 0 96px; height: 96px; border-radius: 10px; }
  .vignette .txt { flex: 1; min-width: 0; padding-top: 2px; }
  .vignette h3 {
    margin: 4px 0 0; font-size: .98rem; line-height: 1.32; font-weight: 650;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .vignette.lu h3 { color: var(--doux); font-weight: 500; }
  .meta { font-size: .76rem; color: var(--doux); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .badge { font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; padding: 2px 7px; border-radius: 6px; }
  .badge.une { background: var(--une-doux); color: var(--une); }
  .badge.avis-1 { background: var(--ok-doux); color: var(--ok); }
  .badge.avis--1 { background: var(--non-doux); color: var(--non); }
  @media (min-width: 700px) {
    .grille { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
    .vignette { flex-direction: column; padding: 0; overflow: hidden; gap: 0; }
    .vignette .media { flex: none; width: 100%; height: 150px; border-radius: 0; }
    .vignette .txt { padding: 12px 14px 16px; }
  }

  /* Visuels : image ou illustration de remplacement */
  .media { position: relative; overflow: hidden; background: var(--surface-2); }
  .media img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .illus {
    position: absolute; inset: 0; display: grid; place-items: center; color: rgba(255,255,255,.92);
    font-weight: 700; font-size: .8rem; letter-spacing: .04em; text-transform: uppercase; text-align: center; padding: 8px;
  }
  .illus svg { width: 36px; height: 36px; opacity: .85; }

  /* ---------- Journal (défilement) ---------- */
  #journal {
    position: fixed; inset: calc(var(--entete) + env(safe-area-inset-top)) 0 0 0; display: flex;
    overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; scrollbar-width: none;
    overscroll-behavior-x: contain; background: var(--fond);
  }
  #journal::-webkit-scrollbar { display: none; }
  .page {
    flex: 0 0 100%; height: 100%; scroll-snap-align: center; scroll-snap-stop: always;
    padding: 12px 12px calc(env(safe-area-inset-bottom) + 12px); display: flex; justify-content: center;
  }
  .fiche {
    width: 100%; max-width: 720px; height: 100%; display: flex; flex-direction: column; overflow: hidden;
    background: var(--surface); border-radius: 20px; box-shadow: var(--ombre);
  }
  .fiche .media { flex: 0 0 auto; height: min(30vh, 280px); }
  .fiche .media.petite { height: min(14vh, 110px); }
  .fiche .corps { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 16px 18px 0; }
  .fiche h2 {
    margin: 8px 0 10px; font-size: clamp(1.2rem, 4.6vw, 1.6rem); line-height: 1.25; letter-spacing: -.01em;
    display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
  }
  .fiche .resume {
    flex: 1; min-height: 0; overflow: hidden; margin: 0; font-family: var(--serif); font-size: clamp(1rem, 4vw, 1.12rem);
    line-height: 1.55; -webkit-mask-image: linear-gradient(#000 80%, transparent); mask-image: linear-gradient(#000 80%, transparent);
  }
  .fiche .pied {
    flex: 0 0 auto; display: flex; gap: 8px; align-items: center; padding: 12px 18px 16px; border-top: 1px solid var(--filet);
  }
  .fiche .pied .btn.principal { flex: 1; }
  .fin { margin: auto; text-align: center; color: var(--doux); padding: 16px; }
  .fin h2 { color: var(--texte); }
  .fleches button {
    position: fixed; top: 50%; z-index: 5; width: 44px; height: 44px; border-radius: 50%;
    background: var(--surface); box-shadow: var(--ombre); display: grid; place-items: center; font-size: 1.3rem;
  }
  #prec { left: max(12px, calc(50% - 420px)); }
  #suiv { right: max(12px, calc(50% - 420px)); }
  @media (max-width: 860px) { .fleches { display: none; } }
  @media (hover: none) { .fleches { display: none; } }

  /* ---------- Lecteur ---------- */
  #lecteur { position: fixed; inset: 0; z-index: 30; background: var(--surface); overflow-y: auto; overscroll-behavior: contain; }
  #lecteur .barre-l {
    position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 6px;
    padding: calc(env(safe-area-inset-top) + 8px) 8px 8px; border-bottom: 1px solid var(--filet);
    background: color-mix(in srgb, var(--surface) 90%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  }
  #lecteur .barre-l .retour { display: inline-flex; align-items: center; gap: 4px; padding: 8px 10px; font-weight: 600; color: var(--accent); }
  #lecteur .barre-l .espace { flex: 1; }
  #lecteur .barre-l a { font-size: .85rem; padding: 8px 10px; border-radius: 10px; color: var(--accent); text-decoration: none; font-weight: 600; }
  .lecture { max-width: 700px; margin: 0 auto; padding: 0 20px calc(env(safe-area-inset-bottom) + 110px); }
  .lecture .media { height: min(38vh, 360px); margin: 0 -20px; }
  .lecture h1 { font-size: clamp(1.5rem, 5.5vw, 2.1rem); line-height: 1.2; letter-spacing: -.015em; margin: 20px 0 10px; }
  .lecture .meta { margin-bottom: 18px; font-size: .85rem; }
  .lecture .texte p.avis-ia, .avis-ia {
    font-family: var(--sans); line-height: 1.45; font-size: .82rem; color: var(--doux); background: var(--surface-2); padding: 10px 12px; border-radius: 10px; margin: 0 0 18px;
  }
  .lecture .resume-l { font-weight: 600; line-height: 1.55; margin: 0 0 18px; }
  .lecture .texte p { font-family: var(--serif); font-size: 1.12rem; line-height: 1.7; margin: 0 0 1.05em; }
  .lecture .indispo { color: var(--doux); font-size: .95rem; }
  .barre-vote {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom) + 16px); z-index: 31;
    display: flex; gap: 8px; padding: 8px; background: var(--surface); border-radius: 16px; box-shadow: 0 6px 24px rgba(0,0,0,.18);
    border: 1px solid var(--filet);
  }

  /* ---------- Feuille de vote ---------- */
  #voile { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.4); }
  #feuille {
    position: fixed; z-index: 41; left: 0; right: 0; bottom: 0; max-height: 85vh; overflow-y: auto; margin: 0 auto; max-width: 640px;
    background: var(--surface); border-radius: 20px 20px 0 0; padding: 10px 18px calc(env(safe-area-inset-bottom) + 18px);
  }
  #feuille .poignee { width: 40px; height: 5px; border-radius: 3px; background: var(--filet); margin: 0 auto 14px; }
  #feuille h3 { margin: 0 0 4px; font-size: 1.15rem; }
  #feuille p { margin: 0 0 14px; color: var(--doux); font-size: .88rem; }
  .puces { display: flex; flex-wrap: wrap; gap: 8px; }
  .puces button { border: 1px solid var(--filet); border-radius: 999px; padding: 9px 13px; font-size: .9rem; }
  .puces button[aria-pressed="true"] { background: var(--texte); color: var(--fond); border-color: var(--texte); }
  #feuille .actions { display: flex; gap: 8px; margin-top: 16px; }
  #feuille .actions .btn { flex: 1; }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-grille" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
  <symbol id="i-cartes" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="3" width="12" height="18" rx="2"/><path d="M3 6v12M21 6v12"/></symbol>
  <symbol id="i-sortie" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l5-5-5-5M15 12H3"/></symbol>
  <symbol id="i-haut" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10v11M2 12v7a2 2 0 0 0 2 2h12.3a2 2 0 0 0 2-1.7l1.4-7A2 2 0 0 0 17.7 10H14V5.5A2.5 2.5 0 0 0 11.5 3L7 10H4a2 2 0 0 0-2 2z"/></symbol>
  <symbol id="i-bas" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 14V3M22 12V5a2 2 0 0 0-2-2H7.7a2 2 0 0 0-2 1.7l-1.4 7A2 2 0 0 0 6.3 14H10v4.5a2.5 2.5 0 0 0 2.5 2.5L17 14h3a2 2 0 0 0 2-2z"/></symbol>
  <symbol id="i-bouclier" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></symbol>
  <symbol id="i-eclair" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></symbol>
</svg>

<section id="connexion" class="cache">
  <form id="form-connexion" autocomplete="on">
    <div class="logo"><img src="icon.svg" alt=""><span>Le Journal</span></div>
    <p class="sous">Veille cyber et judiciaire</p>
    <label for="email">Adresse e-mail</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="mdp">Mot de passe</label>
    <input id="mdp" type="password" autocomplete="current-password" required minlength="10">
    <button class="btn principal" type="submit" id="btn-connexion">Se connecter</button>
    <div class="msg" id="msg-connexion" role="alert"></div>
  </form>
</section>

<section id="attente" class="cache chargement">
  <div style="max-width:340px;text-align:center;padding:16px">
    <p>Votre compte existe, mais il n'est pas encore autorisé à lire le journal.</p>
    <button class="lien" id="btn-deco-attente">Se déconnecter</button>
  </div>
</section>

<div id="app" class="cache">
  <header class="barre">
    <div class="marque"><img src="icon.svg" alt=""><b id="titre-vue">Le Journal</b></div>
    <span class="compteur cache" id="compteur"></span>
    <div class="segment" role="group" aria-label="Période">
      <button data-jours="1" aria-pressed="true">Jour</button>
      <button data-jours="7" aria-pressed="false">7 j</button>
    </div>
    <button class="icone" id="btn-vue" aria-label="Mode journal" title="Mode journal"><svg><use href="#i-cartes"/></svg></button>
    <button class="icone" id="btn-deco" aria-label="Se déconnecter" title="Se déconnecter"><svg><use href="#i-sortie"/></svg></button>
  </header>
  <div class="alerte cache" id="alerte"></div>

  <main id="accueil">
    <section class="essentiel cache" id="essentiel"></section>
    <div class="titre-section"><h2 id="titre-liste">Articles</h2><span id="maj"></span></div>
    <div class="filtres" id="filtres" role="group" aria-label="Thèmes"></div>
    <div class="grille" id="grille"><div class="chargement">Chargement…</div></div>
  </main>

  <main id="journal" class="cache" tabindex="0" aria-label="Articles"></main>
  <div class="fleches cache" id="fleches">
    <button id="prec" aria-label="Article précédent">‹</button>
    <button id="suiv" aria-label="Article suivant">›</button>
  </div>
</div>

<section id="lecteur" class="cache" role="dialog" aria-modal="true" aria-label="Lecture">
  <div class="barre-l">
    <button class="retour" id="btn-retour">‹ Retour</button>
    <span class="espace"></span>
    <a id="l-traduire" target="_blank" rel="noopener noreferrer" class="cache">Traduire ↗</a>
    <a id="l-site" target="_blank" rel="noopener noreferrer">Voir sur le site ↗</a>
  </div>
  <div class="lecture" id="lecture"></div>
  <div class="barre-vote" id="barre-vote"></div>
</section>

<div id="voile" class="cache"></div>
<div id="feuille" class="cache" role="dialog" aria-modal="true" aria-labelledby="feuille-titre">
  <div class="poignee"></div>
  <h3 id="feuille-titre"></h3>
  <p>Pourquoi ? Vos réponses servent à affiner les sources et le tri.</p>
  <div class="puces" id="raisons"></div>
  <label for="commentaire">Un mot de plus (facultatif)</label>
  <textarea id="commentaire" rows="2" maxlength="500"></textarea>
  <div class="actions">
    <button class="btn" id="btn-retirer">Retirer mon avis</button>
    <button class="btn principal" id="btn-enregistrer">Enregistrer</button>
  </div>
</div>

<div id="demarrage" class="chargement" style="min-height:100vh">Chargement…</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" integrity="sha384-GFr3yTh5lJznCbZfpTtXnwboFsxqtTQoeTZCRHhE0579KrRmlCzen5AA8ohaB5ug" crossorigin="anonymous"></script>
<script>
const SUPABASE_URL = "https://wdngyuonaseyvlgiwznu.supabase.co";
const SUPABASE_CLE = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indkbmd5dW9uYXNleXZsZ2l3em51Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUxMzkwMDEsImV4cCI6MjExMDcxNTAwMX0.JB38j-yZ1IFhYYB1D9VPRz4B5mlAJAgDJ3jCMqEnOgk";
const LIMITE = 500;
const COLONNES = "id,url,source,langue,titre,titre_original,resume,theme,score,a_la_une,publie_le,edition,image,contenu_traduit";
const RAISONS = {
  "1": ["Sujet prioritaire pour moi", "Utile pour le travail", "Bien expliqué", "Information exclusive", "Source fiable"],
  "-1": ["Hors sujet", "Déjà vu / doublon", "Trop technique", "Trop superficiel", "Source peu fiable", "Pas d'intérêt pour la France"]
};
const LANGUES = { en: "l'anglais", de: "l'allemand", es: "l'espagnol", it: "l'italien", nl: "le néerlandais", pt: "le portugais" };

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_CLE);
const $ = (id) => document.getElementById(id);
const etat = {
  articles: [], votes: new Map(), synthese: null, jours: 1, theme: null,
  vue: "accueil", liste: [], index: 0, ouvert: null, feuille: null
};

/* ---------- Utilitaires ---------- */
function memoire(cle, valeur) {
  try {
    if (valeur === undefined) return localStorage.getItem(cle);
    localStorage.setItem(cle, valeur);
  } catch (e) { return null; }
}
const lus = new Set((() => { try { return JSON.parse(memoire("lus") || "[]"); } catch (e) { return []; } })());
function marquerLu(id) {
  if (lus.has(id)) return;
  lus.add(id);
  memoire("lus", JSON.stringify([...lus].slice(-3000)));
}
function echapper(t) {
  return String(t ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function urlSure(u) {
  try { const x = new URL(u); return (x.protocol === "https:" || x.protocol === "http:") ? x.href : "#"; }
  catch (e) { return "#"; }
}
function imageSure(u) {
  try { const x = new URL(u); return x.protocol === "https:" ? x.href : null; } catch (e) { return null; }
}
function heure(iso) {
  if (!iso) return "";
  const d = new Date(iso), maintenant = new Date();
  const memeJour = d.toDateString() === maintenant.toDateString();
  const h = d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
  return memeJour ? h : d.toLocaleDateString("fr-FR", { day: "numeric", month: "short" }) + ", " + h;
}
function dateLongue(jour) {
  return new Date(jour + "T12:00:00").toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });
}
function teinte(texte) {
  let h = 0; for (const c of String(texte)) h = (h * 31 + c.charCodeAt(0)) % 360; return h;
}
function visuel(a, classe = "") {
  const img = imageSure(a.image);
  const h = teinte(a.theme || a.source);
  const illus = `<div class="illus" style="background:linear-gradient(135deg,hsl(${h} 55% 42%),hsl(${(h + 40) % 360} 60% 30%))">
      <svg><use href="#i-bouclier"/></svg></div>`;
  return `<div class="media ${classe}">${illus}${img ? `<img src="${echapper(img)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : ""}</div>`;
}
// Image cassée : on laisse l'illustration de remplacement
document.addEventListener("error", (e) => { if (e.target.tagName === "IMG" && e.target.closest(".media")) e.target.remove(); }, true);
const svgVote = (s) => `<svg><use href="#i-${s}"/></svg>`;

function afficher(vue) {
  for (const id of ["demarrage", "connexion", "attente", "app"]) $(id).classList.toggle("cache", id !== vue);
}

/* ---------- Connexion ---------- */
$("form-connexion").onsubmit = async (e) => {
  e.preventDefault();
  $("msg-connexion").textContent = "";
  $("btn-connexion").disabled = true;
  const { error } = await sb.auth.signInWithPassword({ email: $("email").value.trim(), password: $("mdp").value });
  $("btn-connexion").disabled = false;
  if (error) $("msg-connexion").textContent = /Invalid login/i.test(error.message) ? "E-mail ou mot de passe incorrect." : error.message;
};
$("btn-deco").onclick = $("btn-deco-attente").onclick = () => sb.auth.signOut();

let sessionCourante = null;
sb.auth.onAuthStateChange((evt, session) => setTimeout(() => demarrer(session), 0));
async function demarrer(session) {
  const uid = session?.user?.id ?? null;
  if (uid === sessionCourante && uid !== null) return;
  sessionCourante = uid;
  if (!session) {
    if (etat.ouvert) fermerLecteur();
    if (etat.feuille) fermerFeuille();
    etat.vue = "accueil"; majVue(); history.replaceState(null, "");
    afficher("connexion"); return;
  }
  afficher("demarrage");
  const { data, error } = await sb.rpc("est_lecteur");
  if (error || !data) { afficher("attente"); return; }
  afficher("app");
  await charger();
}

/* ---------- Données ---------- */
let numeroRequete = 0;
async function charger() {
  const moi = ++numeroRequete;
  $("grille").innerHTML = '<div class="chargement">Chargement…</div>';

  // Édition la plus récente (le jour même si elle existe)
  const der = await sb.from("articles").select("edition").order("edition", { ascending: false }).limit(1);
  const derniere = der.data?.[0]?.edition;
  let requete = sb.from("articles").select(COLONNES);
  if (etat.jours === 1 && derniere) requete = requete.eq("edition", derniere);
  else {
    const d = new Date(); d.setDate(d.getDate() - 6);
    requete = requete.gte("edition", d.toISOString().slice(0, 10));
  }
  const [arts, exe, syn] = await Promise.all([
    requete.order("edition", { ascending: false }).order("a_la_une", { ascending: false })
      .order("score", { ascending: false }).limit(LIMITE),
    sb.from("executions").select("debut,fin,statut").order("debut", { ascending: false }).limit(1),
    derniere ? sb.from("syntheses").select("edition,points").eq("edition", derniere).maybeSingle() : Promise.resolve({ data: null })
  ]);
  if (moi !== numeroRequete) return;
  if (arts.error) { $("grille").innerHTML = `<div class="chargement">Erreur : ${echapper(arts.error.message)}</div>`; return; }

  const votes = new Map();
  const ids = arts.data.map((a) => a.id);
  for (let i = 0; i < ids.length; i += 200) {
    const v = await sb.from("votes").select("article_id,avis,raisons,commentaire")
      .eq("user_id", sessionCourante).in("article_id", ids.slice(i, i + 200));
    for (const x of v.data ?? []) votes.set(x.article_id, x);
  }
  if (moi !== numeroRequete) return;
  etat.articles = arts.data;
  etat.synthese = syn.data;
  etat.votes = votes;

  afficherMaj(exe.data?.[0], arts.data.length >= LIMITE, derniere);
  rendreAccueil();
  if (etat.vue === "journal") ouvrirJournal(0, false);
}

function afficherMaj(exe, tronque, derniere) {
  let txt = tronque ? `Seuls les ${LIMITE} articles les mieux classés sont affichés. ` : "";
  if (exe) {
    $("maj").textContent = "Mis à jour " + heure(exe.fin || exe.debut);
    const ageH = (Date.now() - new Date(exe.debut).getTime()) / 36e5;
    if (exe.statut === "echec") txt += "⚠ La dernière mise à jour a échoué. Les articles affichés peuvent dater.";
    else if (exe.statut === "en_cours" && ageH > 1.5) txt += "⚠ La dernière mise à jour ne s'est pas terminée.";
    else if (ageH > 30) txt += "⚠ Aucune mise à jour depuis plus d'un jour.";
  } else $("maj").textContent = "";
  $("alerte").textContent = txt;
  $("alerte").classList.toggle("cache", !txt);
  $("titre-liste").textContent = etat.jours === 1 && derniere ? "Articles du " + dateLongue(derniere).replace(/^\w+ /, "") : "Les 7 derniers jours";
}

/* ---------- Accueil ---------- */
function listeFiltree() {
  return etat.theme ? etat.articles.filter((a) => (a.theme || "Autre") === etat.theme) : etat.articles;
}

function rendreAccueil() {
  // L'essentiel du jour
  const s = etat.synthese, ess = $("essentiel");
  const parId = new Map(etat.articles.map((a) => [a.id, a]));
  if (s && Array.isArray(s.points) && s.points.length && etat.jours === 1) {
    ess.innerHTML = `<h2><svg width="20" height="20" style="color:var(--accent)"><use href="#i-eclair"/></svg>L'essentiel du jour</h2>
      <div class="date">${echapper(dateLongue(s.edition))}</div>` +
      s.points.map((p) => {
        const refs = (p.articles || []).map((id) => parId.get(id)).filter(Boolean);
        return `<div class="point"><span class="puce"></span><div style="min-width:0">
          <div class="rub">${echapper(p.rubrique)}</div><p>${echapper(p.texte)}</p>
          <div class="refs">${refs.map((a) => `<button data-ouvrir="${a.id}">${echapper(a.source)} · ${echapper(a.titre)}</button>`).join("")}</div>
        </div></div>`;
      }).join("");
    ess.classList.remove("cache");
  } else ess.classList.add("cache");

  // Filtres par thème
  const compte = new Map();
  for (const a of etat.articles) compte.set(a.theme || "Autre", (compte.get(a.theme || "Autre") || 0) + 1);
  if (etat.theme && !compte.has(etat.theme)) etat.theme = null;
  const themes = [...compte.entries()].sort((x, y) => (x[0] === "Autre") - (y[0] === "Autre") || y[1] - x[1]);
  $("filtres").innerHTML = `<button data-theme="" aria-pressed="${!etat.theme}">Tous · ${etat.articles.length}</button>` +
    themes.map(([t, n]) => `<button data-theme="${echapper(t)}" aria-pressed="${etat.theme === t}">${echapper(t)} · ${n}</button>`).join("");

  // Vignettes
  const liste = listeFiltree();
  $("grille").innerHTML = liste.length ? liste.map((a, i) => {
    const v = etat.votes.get(a.id);
    return `<button class="vignette${lus.has(a.id) ? " lu" : ""}" data-i="${i}">
      ${visuel(a)}
      <div class="txt">
        <div class="meta">${a.a_la_une ? '<span class="badge une">À la une</span>' : ""}
          ${v ? `<span class="badge avis-${v.avis}">${v.avis > 0 ? "Aimé" : "Pas aimé"}</span>` : ""}
          <span>${[echapper(a.source), heure(a.publie_le)].filter(Boolean).join(" · ")}</span></div>
        <h3>${echapper(a.titre)}</h3>
      </div></button>`;
  }).join("") : '<div class="chargement">Aucun article pour cette période.</div>';
}

$("filtres").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  etat.theme = b.dataset.theme || null;
  rendreAccueil();
});
$("grille").addEventListener("click", (e) => {
  const b = e.target.closest(".vignette"); if (!b) return;
  ouvrirJournal(+b.dataset.i);
});
$("essentiel").addEventListener("click", (e) => {
  const b = e.target.closest("[data-ouvrir]"); if (!b) return;
  const a = etat.articles.find((x) => x.id === +b.dataset.ouvrir);
  if (a) ouvrirLecteur(a);
});

/* ---------- Journal ---------- */
function fiche(a, i) {
  const v = etat.votes.get(a.id);
  return `<section class="page" data-i="${i}"><article class="fiche">
    ${visuel(a, imageSure(a.image) ? "" : "petite")}
    <div class="corps">
      <div class="meta">${a.a_la_une ? '<span class="badge une">À la une</span>' : ""}
        <span style="color:var(--accent);font-weight:600">${echapper(a.theme || "Actualité")}</span></div>
      <h2>${echapper(a.titre)}</h2>
      <div class="meta" style="margin-bottom:10px">${[echapper(a.source), heure(a.publie_le), a.langue && a.langue !== "fr" ? "traduit" : ""].filter(Boolean).join(" · ")}</div>
      <p class="resume">${echapper(a.resume)}</p>
    </div>
    <div class="pied">
      <button class="btn principal" data-lire="${a.id}">Lire l'article</button>
      <button class="vote plus" data-id="${a.id}" data-avis="1" data-actif="${v?.avis === 1 ? 1 : 0}" aria-label="J'aime">${svgVote("haut")}</button>
      <button class="vote moins" data-id="${a.id}" data-avis="-1" data-actif="${v?.avis === -1 ? 1 : 0}" aria-label="Je n'aime pas">${svgVote("bas")}</button>
    </div>
  </article></section>`;
}

function ouvrirJournal(index, historique = true) {
  etat.liste = listeFiltree();
  const n = etat.liste.length;
  $("journal").innerHTML = etat.liste.map(fiche).join("") +
    `<section class="page"><div class="fin"><h2>${n ? "Vous avez tout vu" : "Rien de neuf"}</h2>
     <p>${n} article${n > 1 ? "s" : ""}.</p><button class="btn" id="vers-accueil">Retour à l'accueil</button></div></section>`;
  $("vers-accueil").onclick = () => history.back();
  if (etat.vue !== "journal") {
    etat.vue = "journal";
    if (historique) history.pushState({ vue: "journal" }, "");
  }
  majVue();
  etat.index = Math.min(index, n);
  requestAnimationFrame(() => { $("journal").scrollLeft = etat.index * $("journal").clientWidth; majCompteur(); });
}
function fermerJournal() {
  etat.vue = "accueil"; majVue(); rendreAccueil();
}
function majVue() {
  const j = etat.vue === "journal";
  $("accueil").classList.toggle("cache", j);
  $("journal").classList.toggle("cache", !j);
  $("fleches").classList.toggle("cache", !j);
  $("compteur").classList.toggle("cache", !j);
  $("btn-vue").innerHTML = `<svg><use href="#i-${j ? "grille" : "cartes"}"/></svg>`;
  $("btn-vue").setAttribute("aria-label", j ? "Vue en vignettes" : "Mode journal");
  $("btn-vue").title = j ? "Vue en vignettes" : "Mode journal";
  document.body.style.overflow = j ? "hidden" : "";
}
$("btn-vue").onclick = () => { if (etat.vue === "journal") history.back(); else ouvrirJournal(0); };

function majCompteur() {
  const n = etat.liste.length, i = Math.min(etat.index, n - 1);
  $("compteur").textContent = n ? `${i + 1} / ${n}` : "";
  const a = etat.liste[etat.index];
  if (a) marquerLu(a.id);
}
$("journal").addEventListener("scroll", () => {
  const p = $("journal"), i = Math.round(p.scrollLeft / p.clientWidth);
  if (i !== etat.index) { etat.index = i; majCompteur(); }
}, { passive: true });
function aller(delta) { const p = $("journal"); p.scrollTo({ left: (etat.index + delta) * p.clientWidth, behavior: "smooth" }); }
$("prec").onclick = () => aller(-1);
$("suiv").onclick = () => aller(1);
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { if (etat.feuille) fermerFeuille(); else if (etat.ouvert || etat.vue === "journal") history.back(); return; }
  if (etat.vue !== "journal" || etat.ouvert || etat.feuille) return;
  if (e.key === "ArrowRight") aller(1);
  if (e.key === "ArrowLeft") aller(-1);
});
window.addEventListener("resize", () => { if (etat.vue === "journal") $("journal").scrollLeft = etat.index * $("journal").clientWidth; });

$("journal").addEventListener("click", (e) => {
  const lire = e.target.closest("[data-lire]");
  if (lire) { const a = etat.liste.find((x) => x.id === +lire.dataset.lire); if (a) ouvrirLecteur(a); return; }
  const b = e.target.closest(".vote");
  if (b) ouvrirFeuille(+b.dataset.id, +b.dataset.avis);
});

/* ---------- Lecteur ---------- */
async function ouvrirLecteur(a) {
  if (etat.ouvert) return;
  etat.ouvert = a;
  marquerLu(a.id);
  history.pushState({ vue: "lecteur" }, "");
  const etranger = a.langue && a.langue !== "fr";
  $("l-site").href = urlSure(a.url);
  const lt = $("l-traduire");
  lt.href = "https://translate.google.com/translate?sl=auto&tl=fr&u=" + encodeURIComponent(a.url);
  lt.classList.add("cache");
  $("lecture").innerHTML = enteteLecture(a) + '<div class="texte"><p class="indispo">Chargement du texte…</p></div>';
  majBarreVote();
  $("lecteur").classList.remove("cache");
  $("lecteur").scrollTop = 0;
  document.body.style.overflow = "hidden";

  const { data } = await sb.from("articles").select("contenu,contenu_traduit").eq("id", a.id).maybeSingle();
  if (etat.ouvert !== a) return;
  const contenu = data?.contenu;
  const zone = $("lecture").querySelector(".texte");
  if (etranger && !data?.contenu_traduit) lt.classList.remove("cache");
  let avis = "";
  if (etranger && data?.contenu_traduit) avis = `<p class="avis-ia">Traduit de ${LANGUES[a.langue] || "la langue d'origine"} par IA. Le texte original fait foi.</p>`;
  else if (etranger && contenu) avis = `<p class="avis-ia">Texte en version originale. Le bouton « Traduire » en haut ouvre une traduction automatique.</p>`;
  zone.innerHTML = contenu
    ? avis + contenu.split(/\n\s*\n|\n/).map((p) => p.trim()).filter(Boolean).map((p) => `<p>${echapper(p)}</p>`).join("")
    : `<p class="indispo">Le texte complet n'est pas disponible pour cet article (site protégé, ou article publié avant cette fonction).</p>
       <p><a class="btn principal" href="${echapper(urlSure(a.url))}" target="_blank" rel="noopener noreferrer">Lire sur le site ↗</a></p>`;
}
function enteteLecture(a) {
  return `${imageSure(a.image) ? visuel(a) : ""}
    <h1>${echapper(a.titre)}</h1>
    <div class="meta">${a.a_la_une ? '<span class="badge une">À la une</span>' : ""}
      <span>${[echapper(a.source), heure(a.publie_le), echapper(a.theme || "")].filter(Boolean).join(" · ")}</span></div>
    <p class="resume-l">${echapper(a.resume)}</p>`;
}
function majBarreVote() {
  const a = etat.ouvert; if (!a) return;
  const v = etat.votes.get(a.id);
  $("barre-vote").innerHTML =
    `<button class="vote plus" data-id="${a.id}" data-avis="1" data-actif="${v?.avis === 1 ? 1 : 0}" aria-label="J'aime">${svgVote("haut")}</button>
     <button class="vote moins" data-id="${a.id}" data-avis="-1" data-actif="${v?.avis === -1 ? 1 : 0}" aria-label="Je n'aime pas">${svgVote("bas")}</button>`;
}
$("barre-vote").addEventListener("click", (e) => { const b = e.target.closest(".vote"); if (b) ouvrirFeuille(+b.dataset.id, +b.dataset.avis); });
function fermerLecteur() {
  etat.ouvert = null;
  $("lecteur").classList.add("cache");
  document.body.style.overflow = etat.vue === "journal" ? "hidden" : "";
}
$("btn-retour").onclick = () => history.back();

/* ---------- Historique (bouton retour du téléphone) ---------- */
window.addEventListener("popstate", (e) => {
  if (etat.feuille) { fermerFeuille(); history.pushState(e.state, ""); return; }
  if (etat.ouvert) { fermerLecteur(); return; }
  if (etat.vue === "journal" && e.state?.vue !== "journal") fermerJournal();
  else if (etat.vue === "accueil" && e.state?.vue === "journal") ouvrirJournal(0, false);
});

/* ---------- Période ---------- */
document.querySelectorAll("[data-jours]").forEach((b) => b.onclick = () => {
  etat.jours = +b.dataset.jours;
  document.querySelectorAll("[data-jours]").forEach((x) => x.setAttribute("aria-pressed", String(+x.dataset.jours === etat.jours)));
  charger();
});

/* ---------- Votes ---------- */
function ouvrirFeuille(id, avis) {
  const v = etat.votes.get(id);
  const memeAvis = v && v.avis === avis;
  etat.feuille = { id, avis, raisons: new Set(memeAvis ? v.raisons : []) };
  $("feuille-titre").textContent = avis > 0 ? "Vous aimez cet article" : "Vous n'aimez pas cet article";
  $("commentaire").value = memeAvis ? (v.commentaire || "") : "";
  $("btn-retirer").classList.toggle("cache", !v);
  $("raisons").innerHTML = RAISONS[String(avis)].map((r) =>
    `<button type="button" aria-pressed="${etat.feuille.raisons.has(r)}">${echapper(r)}</button>`).join("");
  $("voile").classList.remove("cache"); $("feuille").classList.remove("cache");
}
$("raisons").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  const r = b.textContent;
  if (etat.feuille.raisons.has(r)) etat.feuille.raisons.delete(r); else etat.feuille.raisons.add(r);
  b.setAttribute("aria-pressed", String(etat.feuille.raisons.has(r)));
});
function fermerFeuille() { $("voile").classList.add("cache"); $("feuille").classList.add("cache"); etat.feuille = null; }
$("voile").onclick = fermerFeuille;

$("btn-enregistrer").onclick = async () => {
  const f = etat.feuille; if (!f) return;
  const ligne = { article_id: f.id, user_id: sessionCourante, avis: f.avis, raisons: [...f.raisons], commentaire: $("commentaire").value.trim() || null };
  $("btn-enregistrer").disabled = true;
  const { error } = await sb.from("votes").upsert(ligne, { onConflict: "article_id,user_id" });
  $("btn-enregistrer").disabled = false;
  if (error) { alert("Avis non enregistré : " + error.message); return; }
  etat.votes.set(f.id, ligne);
  fermerFeuille(); apresVote(f.id);
};
$("btn-retirer").onclick = async () => {
  const f = etat.feuille; if (!f) return;
  const { error } = await sb.from("votes").delete().eq("article_id", f.id).eq("user_id", sessionCourante);
  if (error) { alert("Erreur : " + error.message); return; }
  etat.votes.delete(f.id);
  fermerFeuille(); apresVote(f.id);
};
function apresVote(id) {
  majBarreVote();
  const i = etat.liste.findIndex((a) => a.id === id);
  const ancien = document.querySelector(`#journal .page[data-i="${i}"]`);
  if (ancien) {
    const tmp = document.createElement("div");
    tmp.innerHTML = fiche(etat.liste[i], i).trim();
    ancien.replaceWith(tmp.firstElementChild);
  }
  if (etat.vue === "accueil") rendreAccueil();
}
</script>
</body>
</html>
